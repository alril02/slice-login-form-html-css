<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login Form</title>
</head>
<body>
    <main class="halaman">
        <header>
            <img src="images/login.png" alt="Logo" class="logo" width="150">
            <h1>Login</h1>
        </header>
        <form action="">
            <div class="bidang">
                <div class="baris-label">
                    <label for="email">Email</label>
                    <a href="#">Forget Password?</a>
                </div>
                <input type="email" id="email" name="email" placeholder="Enter Your Email" required autocomplete="email" />
            </div>

            <div class="bidang">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Your Password" required autocomplete="current-password" minlength="8" />
            </div>

            <button type="submit" class="tombol-masuk">Login</button>

            <fieldset>
                <legend>Or Continue With</legend>
                <div class="social">
                    <button type="button">
                        <img src="images/Google.png" alt="Login with Google" width="30" />
                    </button>
                    <button type="button">
                        <img src="images/Facebook.png" alt="Login with Facebook" width="30" />
                    </button>
                </div>
            </fieldset>
        </form>
        <footer>
            <p>Not registered yet? <a href="#">Sign Up</a> &rsaquo;</p>
        </footer>
    </main>
</body>
</html>
